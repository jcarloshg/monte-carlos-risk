---
# CLI Contract — monte-carlo-risk v1.0.0
#
# Frozen on: 2026-06-23
# Version: v1.0.0
# Source: ADR-005 (CLI-only v1)
# Consuming phases: 200 (Designing), 300 (Coding), 400 (Testing)
#
# This is the immutable surface contract for the `monte-carlo` CLI.
# Any change requires a new contract version (v1.x.y), a new ADR, and a new ticket.
# The CLI itself validates its inputs against this contract at runtime;
# CI validates that the contract matches the actual `--help` output.

# ============================================================
# Conventions
# ============================================================
#
# stdout: machine-readable JSON. Always valid JSON, one document per run.
#         Schema varies by command.
# stderr: human-readable messages by default. On error, emits EXACTLY ONE
#         canonical JSON error line matching `error_schema` (below). Other
#         lines may be structlog JSON logs.
# Exit codes: documented per command below.
# All flags accept `--flag value` or `--flag=value`. Single-dash forms are
# not supported.
# All paths are resolved relative to the current working directory unless
# absolute.

cli:
  name: monte-carlo
  version_source: src/monte_carlo_risk/__init__.py:__version__
  python_minimum: "3.12"
  invocation_modes:
    - direct: "python -m monte_carlo_risk <command> [...]"
    - docker: "docker compose run --rm monte-carlo <command> [...]"

# ============================================================
# Global flags (apply to every command)
# ============================================================
global_flags:
  - name: --log-level
    type: enum
    values: [DEBUG, INFO, WARNING, ERROR]
    default: INFO
    description: Minimum log level for stderr.
  - name: --log-format
    type: enum
    values: [json, text]
    default: json
    description: "Log line format. 'json' is structured logging for machines; 'text' is for humans."
  - name: --run-id
    type: uuid4_or_auto
    default: auto
    description: >
      Stable identifier for this run. If 'auto', a UUID4 is generated.
      The same --run-id is embedded in every output artifact filename and
      in every log line's 'run_id' field.

# ============================================================
# Commands
# ============================================================
commands:

  # --------------------------------------------------------
  # simulate
  # --------------------------------------------------------
  # Runs the full pipeline: load portfolio -> load market data -> simulate
  # -> compute risk metrics -> render charts.
  - name: simulate
    description: >
      Run a Monte Carlo simulation on the given portfolio and emit risk
      reports + charts.
    flags:
      - name: --portfolio
        type: path_or_inline
        required: true
        description: >
          Either a path to a portfolio YAML file or an inline portfolio
          spec (see portfolio_schema).
      - name: --n-paths
        type: int
        required: false
        default: 10000
        validation: "> 0 and <= 1000000"
        description: Number of Monte Carlo paths to simulate.
      - name: --horizon
        type: int
        required: false
        default: 252
        validation: "> 0 and <= 2520"
        description: Number of trading days in each simulated path.
      - name: --seed
        type: int
        required: false
        default: 1729
        description: RNG seed for reproducibility (NFR-4).
      - name: --provider
        type: enum
        values: [mock, http]
        default: mock
        description: >
          MarketDataSource adapter to use. 'http' is v2 (see ADR-003,
          Spike S-001) and raises NotImplementedError in v1.
      - name: --output-dir
        type: path
        required: false
        default: ./output
        description: Directory for PNG + JSON artifacts. Created if missing.
      - name: --confidence
        type: float
        required: false
        default: 0.95
        validation: "0 < x < 1"
        description: Confidence level for VaR/CVaR (e.g., 0.95 = 95%).
    stdout_schema_ref: "#/schemas/simulation_report"
    exit_codes:
      0: success
      2: input validation failure (see error_schema)
      3: MarketDataSource load failure
      4: Simulation runtime failure
      5: RiskMetrics computation failure
      6: Visualization rendering failure
    stderr_success_lines:
      - "one structlog JSON line per domain event (PortfolioDefined, MarketDataLoaded, SimulationStarted, SimulationCompleted, RiskMetricsCalculated, ChartsRendered)"
    stderr_failure_lines:
      - "exactly one canonical JSON error line matching error_schema"
      - "any number of structlog JSON log lines above it"

  # --------------------------------------------------------
  # validate-portfolio
  # --------------------------------------------------------
  # Static-only check that a portfolio YAML matches the contract
  # (no simulation).
  - name: validate-portfolio
    description: Validate a portfolio file without running a simulation.
    flags:
      - name: --portfolio
        type: path_or_inline
        required: true
    stdout_schema_ref: "#/schemas/portfolio_validation_report"
    exit_codes:
      0: portfolio is valid
      2: portfolio is invalid (details in stdout report under .errors)

  # --------------------------------------------------------
  # describe-mock-data
  # --------------------------------------------------------
  # Reports the bundled mock data corpus (tickers, date range, frequency,
  # source version).
  - name: describe-mock-data
    description: Print metadata about the bundled mock market data.
    flags: []
    stdout_schema_ref: "#/schemas/mock_data_descriptor"
    exit_codes:
      0: success
      3: bundled mock data files missing

# ============================================================
# Schemas
# ============================================================
schemas:

  # --------------------------------------------------------
  # portfolio_schema
  # --------------------------------------------------------
  # A portfolio is either a path to a YAML file matching this schema, or
  # an inline `--portfolio 'AAPL:0.4,MSFT:0.3,GOOG:0.3'` spec parsed
  # identically.
  portfolio_schema:
    type: object
    required: [holdings]
    additionalProperties: false
    properties:
      holdings:
        type: array
        minItems: 1
        items:
          type: object
          required: [ticker, weight]
          additionalProperties: false
          properties:
            ticker:
              type: string
              minLength: 1
              maxLength: 16
              pattern: "^[A-Z0-9.-]+$"
            weight:
              type: number
              minimum: 0
              maximum: 1
    invariants:
      - "sum(holdings[*].weight) == 1.0 (within 1e-9)"
      - "no duplicate tickers"
    violations:
      - code: weights_sum_must_equal_one
        when: "sum != 1.0"
      - code: duplicate_ticker
        when: "any ticker appears more than once"
      - code: empty_holdings
        when: "holdings == []"
      - code: negative_weight
        when: "any weight < 0"

  # --------------------------------------------------------
  # simulation_report (stdout of `simulate`)
  # --------------------------------------------------------
  simulation_report:
    type: object
    required: [run_id, parameters, risk_report, artifacts]
    additionalProperties: false
    properties:
      run_id:
        type: string
        format: uuid
      parameters:
        type: object
        required: [portfolio, n_paths, horizon, seed, provider, confidence]
        properties:
          portfolio:
            type: object
            description: Echo of the resolved portfolio.
          n_paths: { type: integer }
          horizon: { type: integer }
          seed: { type: integer }
          provider: { type: string, enum: [mock, http] }
          confidence: { type: number }
      risk_report:
        type: object
        required: [var, cvar, max_drawdown_distribution, terminal_wealth_distribution]
        properties:
          var:
            type: number
            description: VaR at the requested confidence level (positive number = loss).
          cvar:
            type: number
            description: CVaR at the requested confidence level.
          max_drawdown_distribution:
            type: object
            required: [mean, std, p05, p50, p95]
            properties:
              mean: { type: number }
              std:  { type: number }
              p05:  { type: number }
              p50:  { type: number }
              p95:  { type: number }
          terminal_wealth_distribution:
            type: object
            required: [mean, std, p05, p50, p95]
            properties:
              mean: { type: number }
              std:  { type: number }
              p05:  { type: number }
              p50:  { type: number }
              p95:  { type: number }
      artifacts:
        type: object
        required: [paths_png, drawdown_png, fan_chart_png, report_json]
        properties:
          paths_png:       { type: string, description: "Absolute path to the paths chart PNG." }
          drawdown_png:    { type: string, description: "Absolute path to the drawdown chart PNG." }
          fan_chart_png:   { type: string, description: "Absolute path to the fan chart PNG." }
          report_json:     { type: string, description: "Absolute path to a self-describing JSON report." }
      timing_seconds:
        type: object
        required: [total, simulation, risk_metrics, visualization]
        properties:
          total:        { type: number }
          simulation:   { type: number }
          risk_metrics: { type: number }
          visualization:{ type: number }

  # --------------------------------------------------------
  # portfolio_validation_report (stdout of `validate-portfolio`)
  # --------------------------------------------------------
  portfolio_validation_report:
    type: object
    required: [valid, errors, portfolio]
    properties:
      valid: { type: boolean }
      errors:
        type: array
        items:
          type: object
          required: [code, message]
          properties:
            code:    { type: string }
            message: { type: string }
      portfolio:
        type: object
        description: Echo of the parsed portfolio (empty object if parsing failed).

  # --------------------------------------------------------
  # mock_data_descriptor (stdout of `describe-mock-data`)
  # --------------------------------------------------------
  mock_data_descriptor:
    type: object
    required: [provider, version, tickers, date_range, frequency]
    properties:
      provider: { type: string, enum: [mock] }
      version:
        type: string
        description: >
          Mock data corpus version. Changes to this string invalidate
          reproducibility (NFR-4).
      tickers:
        type: array
        items: { type: string }
      date_range:
        type: object
        properties:
          start: { type: string, format: date }
          end:   { type: string, format: date }
      frequency:
        type: string
        enum: [daily]

  # --------------------------------------------------------
  # error_schema (canonical stderr error line)
  # --------------------------------------------------------
  # Every CLI failure emits EXACTLY ONE line matching this schema to
  # stderr, in addition to any number of structured log lines.
  error_schema:
    type: object
    required: [error_code, message, run_id]
    additionalProperties: false
    properties:
      error_code:
        type: string
        enum:
          - weights_sum_must_equal_one
          - duplicate_ticker
          - empty_holdings
          - negative_weight
          - portfolio_file_not_found
          - portfolio_yaml_parse_error
          - market_data_load_failed
          - market_data_corpus_missing
          - provider_not_implemented
          - simulation_runtime_failed
          - risk_metrics_failed
          - visualization_failed
          - output_dir_not_writable
          - invalid_simulation_transition
      message:
        type: string
        description: Human-readable explanation.
      context:
        type: object
        description: >
          Structured context for debugging. Contents vary by error_code;
          never includes secrets.
        additionalProperties: true
      run_id:
        type: string
        format: uuid
        description: >
          The --run-id from the failed invocation, or a generated UUID4
          if --run-id was 'auto'.

# ============================================================
# Versioning Rules
# ============================================================
versioning:
  major: "vN.0.0 — a flag is removed, a flag's type changes, the exit-code table changes, or a top-level command is removed."
  minor: "v1.N.0 — a new flag, a new top-level command, or a new optional field in any schema."
  patch: "v1.0.N — clarification, wording fix, no behavioral change."
  supersession: >
    A new contract version supersedes the previous one. CI must verify
    the CLI's actual --help output matches the contract.
