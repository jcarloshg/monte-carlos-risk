asyncapi: 3.0.0
info:
  title: mc-risk event bus
  version: 1.0.0
  description: |
    **v1 has no broker.** Events are written to an append-only JSONL file at
    `./output/<runId>/events.jsonl` (see ADR-003). The AsyncAPI document
    below exists so the event contract is the source of truth for any future
    broker adapter (Kafka, SNS/SQS, EventBridge) and so contract tests can
    validate every emitted JSONL row against the schema references below.

    Channels in this document correspond to event types, not to physical
    topics. A future Kafka adapter will map one channel to one topic; the
    envelope (schemaVersion, runId, sequenceNumber, correlationId,
    occurredAt, eventType) maps to Kafka headers + key (runId).

defaultContentType: application/json

channels:
  simulationRequested:
    address: ./output/{runId}/events.jsonl
    description: |
      Per-run JSONL log. The CLI opens the file in append mode and writes one
      envelope per line. `runId` in the address is a placeholder; the actual
      value is in the envelope payload.
    messages:
      simulationRequested.message:
        $ref: "#/components/messages/SimulationRequested"

  returnsLoaded:
    address: ./output/{runId}/events.jsonl
    messages:
      returnsLoaded.message:
        $ref: "#/components/messages/ReturnsLoaded"

  pathSampled:
    address: ./output/{runId}/events.jsonl
    messages:
      pathSampled.message:
        $ref: "#/components/messages/PathSampled"

  drawdownComputed:
    address: ./output/{runId}/events.jsonl
    messages:
      drawdownComputed.message:
        $ref: "#/components/messages/DrawdownComputed"

  riskMetricsCalculated:
    address: ./output/{runId}/events.jsonl
    messages:
      riskMetricsCalculated.message:
        $ref: "#/components/messages/RiskMetricsCalculated"

  simulationCompleted:
    address: ./output/{runId}/events.jsonl
    messages:
      simulationCompleted.message:
        $ref: "#/components/messages/SimulationCompleted"

  simulationFailed:
    address: ./output/{runId}/events.jsonl
    messages:
      simulationFailed.message:
        $ref: "#/components/messages/SimulationFailed"

operations:
  publishRequested:    { action: send, channel: { $ref: "#/channels/simulationRequested" } }
  publishReturns:     { action: send, channel: { $ref: "#/channels/returnsLoaded" } }
  publishPaths:       { action: send, channel: { $ref: "#/channels/pathSampled" } }
  publishDrawdowns:   { action: send, channel: { $ref: "#/channels/drawdownComputed" } }
  publishMetrics:     { action: send, channel: { $ref: "#/channels/riskMetricsCalculated" } }
  publishCompleted:   { action: send, channel: { $ref: "#/channels/simulationCompleted" } }
  publishFailed:      { action: send, channel: { $ref: "#/channels/simulationFailed" } }

components:
  messages:
    SimulationRequested:
      name: SimulationRequested
      title: A new simulation has been requested.
      headers:
        schemaVersion: { const: "1.0.0" }
        eventType:     { const: SimulationRequested }
      payload:
        allOf:
          - $ref: "events/envelope.schema.json"
          - properties:
              payload: { $ref: "events/simulation_requested.schema.json" }

    ReturnsLoaded:
      name: ReturnsLoaded
      title: Historical returns were attached to the run.
      headers:
        schemaVersion: { const: "1.0.0" }
        eventType:     { const: ReturnsLoaded }
      payload:
        allOf:
          - $ref: "events/envelope.schema.json"
          - properties:
              payload: { $ref: "events/returns_loaded.schema.json" }

    PathSampled:
      name: PathSampled
      title: One batch of 1,000 paths has been sampled.
      headers:
        schemaVersion: { const: "1.0.0" }
        eventType:     { const: PathSampled }
      payload:
        allOf:
          - $ref: "events/envelope.schema.json"
          - properties:
              payload: { $ref: "events/path_sampled.schema.json" }

    DrawdownComputed:
      name: DrawdownComputed
      title: MaxDrawdown has been computed for one path batch.
      headers:
        schemaVersion: { const: "1.0.0" }
        eventType:     { const: DrawdownComputed }
      payload:
        allOf:
          - $ref: "events/envelope.schema.json"
          - properties:
              payload: { $ref: "events/drawdown_computed.schema.json" }

    RiskMetricsCalculated:
      name: RiskMetricsCalculated
      title: VaR, CVaR, and terminal-wealth stats are available.
      headers:
        schemaVersion: { const: "1.0.0" }
        eventType:     { const: RiskMetricsCalculated }
      payload:
        allOf:
          - $ref: "events/envelope.schema.json"
          - properties:
              payload: { $ref: "events/risk_metrics_calculated.schema.json" }

    SimulationCompleted:
      name: SimulationCompleted
      title: Terminal success event.
      headers:
        schemaVersion: { const: "1.0.0" }
        eventType:     { const: SimulationCompleted }
      payload:
        allOf:
          - $ref: "events/envelope.schema.json"
          - properties:
              payload: { $ref: "events/simulation_completed.schema.json" }

    SimulationFailed:
      name: SimulationFailed
      title: Terminal failure event. Same shape as the canonical CLI error response.
      headers:
        schemaVersion: { const: "1.0.0" }
        eventType:     { const: SimulationFailed }
      payload:
        allOf:
          - $ref: "events/envelope.schema.json"
          - properties:
              payload: { $ref: "events/simulation_failed.schema.json" }
