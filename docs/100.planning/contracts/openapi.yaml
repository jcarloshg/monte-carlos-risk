openapi: 3.1.0
info:
  title: mc-risk CLI surface
  version: 1.0.0
  description: |
    **This is not an HTTP API.** v1 exposes only a CLI (see ADR-005). This
    document describes the CLI command surface using OpenAPI 3.1's `paths:`
    schema so a future REST surface can be added by converting each operation
    to an HTTP route with the same `operationId`. Exit codes map 1-to-1 to
    HTTP status codes (see ADR-005 mapping table).

    The CLI is built with Click/Typer; commands, flags, and exit codes below
    are frozen. Any change requires a new contract file with a bumped
    `schemaVersion`.

servers: []

tags:
  - name: simulation
    description: Run, replay, and compare Monte Carlo simulations.
  - name: portfolio
    description: Inspect portfolios (read-only in v1).
  - name: contracts
    description: Regenerate JSON Schemas from Pydantic models.

paths:
  /run:
    post:
      operationId: runSimulation
      tags: [simulation]
      summary: Run a new Monte Carlo simulation.
      description: |
        Reads `portfolio.json` and `simulation_profile.json`, executes the
        engine, and writes `./output/<runId>/` (events.jsonl, metrics.json,
        PNGs). Always emits `SimulationRequested` as the first event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [portfolio, profile]
              properties:
                portfolio:
                  $ref: "portfolio.schema.json"
                profile:
                  $ref: "simulation_profile.schema.json"
      responses:
        "200":
          description: Run completed. Run ID is printed to stdout.
          content:
            application/json:
              schema:
                type: object
                required: [runId, status, outputDir]
                properties:
                  runId: { type: string, format: uuid }
                  status: { type: "string", const: COMPLETED }
                  outputDir: { type: string }
        "422": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/PortfolioNotFound" }
        "503": { $ref: "#/components/responses/InsufficientMemory" }
        "500": { $ref: "#/components/responses/AssertionOrInfra" }

  /replay:
    post:
      operationId: replaySimulation
      tags: [simulation]
      summary: Re-run a previous simulation byte-for-byte from its persisted seed.
      parameters:
        - name: runId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Replay completed. metrics.json is byte-identical (modulo correlationId, occurredAt).
          content:
            application/json:
              schema:
                type: object
                required: [runId, status]
                properties:
                  runId: { type: string, format: uuid }
                  status: { type: "string", const: COMPLETED }
        "404": { $ref: "#/components/responses/PortfolioNotFound" }

  /compare:
    post:
      operationId: comparePortfolios
      tags: [simulation]
      summary: Run two portfolios back-to-back and emit a side-by-side histogram.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [portfolioA, portfolioB, profile]
              properties:
                portfolioA: { $ref: "portfolio.schema.json" }
                portfolioB: { $ref: "portfolio.schema.json" }
                profile:   { $ref: "simulation_profile.schema.json" }
      responses:
        "200":
          description: Comparison complete.
          content:
            application/json:
              schema:
                type: object
                required: [runIdA, runIdB]
                properties:
                  runIdA: { type: string, format: uuid }
                  runIdB: { type: string, format: uuid }
        "422": { $ref: "#/components/responses/ValidationError" }

  /portfolio/show:
    get:
      operationId: showPortfolio
      tags: [portfolio]
      summary: Print a portfolio JSON (read-only).
      parameters:
        - name: portfolioId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Portfolio found.
          content:
            application/json:
              schema: { $ref: "portfolio.schema.json" }
        "404": { $ref: "#/components/responses/PortfolioNotFound" }

  /contracts/regenerate:
    post:
      operationId: regenerateContracts
      tags: [contracts]
      summary: Run `make contracts`. Regenerates JSON Schemas from Pydantic models.
      description: CI-only operation. Fails CI if `git status` shows a diff after regeneration.
      responses:
        "200":
          description: Schemas are up to date.

components:
  responses:
    ValidationError:
      description: |
        Pydantic validation failed (CLI exit code 2). Examples: weight sum
        != 1, horizon out of range, confidence outside (0,1).
      content:
        application/json:
          schema: { $ref: "events/simulation_failed.schema.json" }
    PortfolioNotFound:
      description: Portfolio or returns file not found (CLI exit code 3).
      content:
        application/json:
          schema: { $ref: "events/simulation_failed.schema.json" }
    InsufficientMemory:
      description: |
        Estimated memory budget would be exceeded (CLI exit code 4).
        No partial run is persisted.
      content:
        application/json:
          schema: { $ref: "events/simulation_failed.schema.json" }
    AssertionOrInfra:
      description: |
        Assertion failed (NaN/Inf, CLI exit code 5) or infrastructure error
        (disk full, CLI exit code 6). The SimulationFailed event is the
        source of truth.
      content:
        application/json:
          schema: { $ref: "events/simulation_failed.schema.json" }
